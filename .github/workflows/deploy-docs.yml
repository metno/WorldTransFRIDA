name: Deploy docs to GitHub Pages

# Builds the FRIDA documentation site and publishes each branch to its own
# versioned subdirectory of the gh-pages branch using `mike`, e.g.
#   https://metno.github.io/WorldTransFRIDA/main/   shown in the selector as "v3.1"
#   https://metno.github.io/WorldTransFRIDA/v2/     shown in the selector as "v2.1"
# The site root redirects to whichever version is the default (main).
#
# This file is intentionally identical on main and v2: a push only ever runs the
# copy on the branch that was pushed, so one shared file covers both and will not
# conflict if the branches are merged.

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:        # allow manual runs from the Actions tab

# mike commits the built site to the gh-pages branch, so the token needs write access.
permissions:
  contents: write

# Every branch writes to the same gh-pages branch — never run two deploys at once.
# cancel-in-progress: false lets an in-flight deploy finish before the next starts.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # mike needs history to read/update gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material and mike
        run: pip install mkdocs-material mike

      - name: Generate the docs from the FRIDA model
        # Rewrites mkdocs.yml + the generated content (both gitignored), so this
        # must run before the build.
        run: python docs/gen_docs.py

      - name: Configure git identity for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch existing versions (preserve other branches' subdirectories)
        run: git fetch origin gh-pages --depth=1 || true

      - name: Deploy this branch as its own version
        # The version id stays the branch name: cleanup-docs.yml matches on it to
        # remove a deleted branch's docs, and it is what the /main/ and /v2/ URLs
        # are built from. --title only changes the label in the version selector.
        run: |
          case "${{ github.ref_name }}" in
            main) title="v3.1" ;;
            v2)   title="v2.1" ;;
            *)    title="${{ github.ref_name }}" ;;
          esac
          mike deploy --push --title "$title" "${{ github.ref_name }}"

      - name: Point the site root at the main version
        if: github.ref_name == 'main'
        run: mike set-default --push main
